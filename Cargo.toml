[package]
name = "todolist"
version = "0.1.0"
authors = ["Eindride Ilmari Kjersheim <eindride.kjersheim@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
dioxus-fullstack = { version = "0.7.1", optional = true }
axum_session = { version = "0.21.0", optional = true }
axum_session_auth = { version = "0.21.0", optional = true }
async-trait = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", features = ["clock", "serde"], optional = true }

serde_json = { version = "1.0", optional = true }
tower = { version = "0.5", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:argon2",
    "dep:rand",
    "dep:axum",
    "dep:http",
    "dep:dioxus-fullstack",
    "dep:axum_session",
    "dep:axum_session_auth",
    "dep:async-trait",
    "dep:anyhow",
    "dep:chrono",
    "dep:serde_json",
    "dep:tower",
]


